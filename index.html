<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>新竹縣關西鎮太平國民小學 72週年校慶 - 捐款芳名錄即時大屏</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700;900&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --red-primary: #c62020;
      --red-dark: #8e1111;
      --red-strip: linear-gradient(180deg, #d82626 0%, #b71818 100%);
      --gold-light: #fff3b0;
      --gold-main: #ffd54f;
      --gold-Rich: #f5b014;
      --ink-black: #1a0909;
      --card-font-size: 20px;
      --header-font-size: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Noto Serif TC', 'DFKai-SB', '標楷體', 'BiauKai', serif;
      background-color: #aee2f5;
    }

    /* 邀請卡背景圖層 */
    .bg-layer {
      position: fixed;
      inset: 0;
      background-image: url('72周年校慶邀請卡_p1.jpg');
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      z-index: 0;
    }

    /* 柔和光暈遮罩，確保邀請卡色彩鮮明同時讓芳名錄清晰易讀 */
    .bg-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* 主容器：100vw x 100vh 單頁不捲動 */
    .screen-wrapper {
      position: relative;
      z-index: 2;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 1.0vh 1.6vw 1.2vh 1.6vw;
    }

    /* 最大化版面模式（當筆數極多或長輩想看更大字時） */
    body.layout-full .screen-wrapper {
      padding: 0.6vh 1.0vw 0.8vh 1.0vw;
    }

    /* 頂部標題區：結合校徽與傳統五圓金章「捐 款 芳 名 錄」 */
    .top-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(90deg, rgba(168, 18, 18, 0.94) 0%, rgba(205, 32, 32, 0.96) 50%, rgba(168, 18, 18, 0.94) 100%);
      border: 2.5px solid #ffd54f;
      border-radius: 16px;
      padding: 0.6vh 1.5vw;
      box-shadow: 0 6px 20px rgba(120, 0, 0, 0.35), inset 0 0 15px rgba(255, 215, 0, 0.25);
      flex-shrink: 0;
      margin-bottom: 0.9vh;
    }

    .school-brand {
      display: flex;
      align-items: center;
      gap: 0.9vw;
    }

    .school-emblem {
      height: 6.2vh;
      width: auto;
      background: #ffffff;
      border-radius: 50%;
      padding: 3px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      object-fit: contain;
    }

    body.layout-full .school-emblem {
      height: 4.8vh;
    }

    .school-titles {
      display: flex;
      flex-direction: column;
    }

    .school-name {
      color: #fff9db;
      font-size: clamp(14px, 1.85vh, 26px);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .event-subtitle {
      color: #ffd54f;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: clamp(11px, 1.35vh, 18px);
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    /* 復刻照片中「捐 款 芳 名 錄」五個金色太陽圓章 */
    .honor-medallions {
      display: flex;
      align-items: center;
      gap: clamp(6px, 0.9vw, 18px);
    }

    .medallion {
      width: clamp(38px, 6.2vh, 72px);
      height: clamp(38px, 6.2vh, 72px);
      border-radius: 50%;
      background: radial-gradient(circle, #fffde7 0%, #ffe082 62%, #ffb300 100%);
      border: 3px solid #f8bbd0;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.35), inset 0 0 6px #ff6f00;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DFKai-SB', '標楷體', 'Noto Serif TC', serif;
      font-size: clamp(22px, 3.8vh, 46px);
      font-weight: 900;
      color: #1b0505;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    body.layout-full .medallion {
      width: clamp(32px, 4.8vh, 54px);
      height: clamp(32px, 4.8vh, 54px);
      font-size: clamp(18px, 3.0vh, 36px);
    }

    /* 右側即時狀態與統計 */
    .header-status {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.3vh;
      font-family: 'Noto Sans TC', sans-serif;
    }

    .donor-counter {
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 213, 79, 0.6);
      color: #fffdf0;
      padding: 0.3vh 0.85vw;
      border-radius: 999px;
      font-size: clamp(12px, 1.5vh, 20px);
      font-weight: 700;
    }

    .donor-counter strong {
      color: #ffeb3b;
      font-size: 1.15em;
      margin: 0 3px;
    }

    .sync-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, 0.9);
      font-size: clamp(10px, 1.15vh, 14px);
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4caf50;
      box-shadow: 0 0 8px #4caf50;
      animation: pulseDot 2s infinite;
    }

    .sync-dot.syncing {
      background: #ffeb3b;
      box-shadow: 0 0 10px #ffeb3b;
    }

    .sync-dot.offline {
      background: #ff9800;
      box-shadow: 0 0 8px #ff9800;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.7; }
    }

    /* 中央芳名錄紅榜大底板（覆蓋邀請卡中央空白框，四周露出邀請卡繽紛插畫與底部標語） */
    .board-container {
      flex: 1;
      min-height: 0;
      width: 100%;
      background: linear-gradient(180deg, rgba(255, 228, 232, 0.93) 0%, rgba(252, 212, 220, 0.93) 100%);
      border: 4px solid #c62020;
      outline: 2px solid #ffd54f;
      border-radius: 14px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.25), inset 0 0 24px rgba(198, 32, 32, 0.12);
      padding: 8px;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* 捐款項目網格：由 JS 動態計算最佳列數與欄數，保證全部塞在同一頁且每格大小完全一致 */
    .donations-grid {
      flex: 1;
      width: 100%;
      height: 100%;
      display: grid;
      gap: 6px;
      align-content: stretch;
      justify-content: stretch;
    }

    /* ==========================================================
       樣式 A：傳統手寫紅榜直書風 (vertical-red)
       完全還原照片：上方「感 捐 / 謝 贈」，右欄直書捐款人、左欄直書禮金或物資
       ========================================================== */
    .donations-grid.style-vertical-red {
      direction: rtl; /* 傳統紅榜由右至左排列！也可切換由左至右 */
    }
    .donations-grid.style-vertical-red.ltr-order {
      direction: ltr;
    }

    .donor-card.vertical-red {
      direction: ltr;
      background: linear-gradient(180deg, #d62424 0%, #bd1717 100%);
      border: 1.5px solid rgba(255, 215, 64, 0.75);
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(105, 8, 8, 0.3);
      display: flex;
      flex-direction: column;
      padding: 4px 3px 5px 3px;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* 頂部「感謝 / 捐贈」雙欄橫頭 */
    .donor-card.vertical-red .strip-top-labels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid rgba(255, 224, 130, 0.45);
      padding-bottom: 2px;
      margin-bottom: 3px;
      flex-shrink: 0;
      text-align: center;
      font-weight: 900;
      line-height: 1.08;
      color: #140303;
      font-size: calc(var(--card-font-size) * 0.78);
    }

    .donor-card.vertical-red.gold-ink .strip-top-labels {
      color: #ffe57f;
    }

    .donor-card.vertical-red .label-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 下方直書雙欄主體：右欄為捐款人、左欄為捐款金額或物資 */
    .donor-card.vertical-red .strip-body {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px;
      width: 100%;
    }

    .donor-card.vertical-red .vertical-col {
      writing-mode: vertical-rl;
      text-orientation: upright;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      font-weight: 900;
      color: #110202;
      font-size: var(--card-font-size);
      line-height: 1.05;
      letter-spacing: -0.02em;
      overflow: hidden;
      word-break: break-all;
      padding-top: 2px;
    }

    .donor-card.vertical-red.gold-ink .vertical-col {
      color: #fff8e1;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
    }

    .donor-card.vertical-red .donor-col {
      border-left: 1px dashed rgba(255, 215, 64, 0.25);
    }

    /* ==========================================================
       樣式 B：喜慶橫式紅金卡 (horizontal-card)
       適合長輩橫向閱讀，字體超清晰，每張卡片等高等寬
       ========================================================== */
    .donor-card.horizontal-card {
      background: linear-gradient(135deg, #cf1f1f 0%, #a81212 100%);
      border: 1.8px solid #ffd54f;
      border-radius: 8px;
      box-shadow: 0 3px 8px rgba(100, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4px 8px;
      position: relative;
      overflow: hidden;
    }

    .donor-card.horizontal-card .h-top-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 4px;
      border-bottom: 1px solid rgba(255, 213, 79, 0.35);
      padding-bottom: 2px;
      margin-bottom: 2px;
    }

    .donor-card.horizontal-card .h-thanks-tag {
      font-size: calc(var(--card-font-size) * 0.68);
      color: #ffd54f;
      font-weight: 700;
      flex-shrink: 0;
    }

    .donor-card.horizontal-card .h-donor-name {
      font-size: var(--card-font-size);
      color: #ffffff;
      font-weight: 900;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      text-align: left;
    }

    .donor-card.horizontal-card .h-gift-row {
      font-size: calc(var(--card-font-size) * 0.92);
      color: #ffeb3b;
      font-weight: 900;
      text-align: right;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    /* 新登錄芳名錄高亮金光特效 */
    .donor-card.newly-added {
      animation: newCardGlow 2.2s ease-in-out 4;
      z-index: 5;
    }

    @keyframes newCardGlow {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(255, 235, 59, 0);
        border-color: #ffd54f;
      }
      50% {
        box-shadow: 0 0 22px 6px rgba(255, 235, 59, 0.95);
        border-color: #ffffff;
        transform: scale(1.03);
      }
    }

    /* 底部留白區：讓邀請卡的「2026.11.21 太平72 酷力全開」紅布條自然呈現，或顯示精簡資訊列 */
    .bottom-spacer {
      height: 11.5vh;
      flex-shrink: 0;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      pointer-events: none;
    }

    body.layout-full .bottom-spacer {
      height: 0.4vh;
    }

    /* 懸浮控制面板（滑鼠移到右下角或按空白鍵時顯示，平時完全隱形不干擾大屏） */
    .floating-controls {
      position: fixed;
      bottom: 14px;
      right: 16px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(25, 10, 10, 0.88);
      backdrop-filter: blur(8px);
      border: 1.5px solid #ffd54f;
      padding: 8px 14px;
      border-radius: 999px;
      opacity: 0.15;
      transition: opacity 0.25s ease, transform 0.25s ease;
      font-family: 'Noto Sans TC', sans-serif;
    }

    .floating-controls:hover,
    .floating-controls.visible {
      opacity: 1;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.14);
      color: #fff;
      border: 1px solid rgba(255, 213, 79, 0.5);
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .ctrl-btn:hover {
      background: #ffd54f;
      color: #1a0505;
    }

    .ctrl-btn.active {
      background: #c62020;
      border-color: #ffd54f;
      color: #fff;
    }

    /* 新捐款即時賀喜橫幅 (Toast) */
    .celebration-toast {
      position: fixed;
      top: 10.5vh;
      left: 50%;
      transform: translateX(-50%) translateY(-30px);
      z-index: 100;
      background: linear-gradient(90deg, #8e0e0e 0%, #d32f2f 50%, #8e0e0e 100%);
      border: 3px solid #ffeb3b;
      border-radius: 999px;
      padding: 12px 36px;
      color: #fff;
      font-size: clamp(20px, 3.2vh, 42px);
      font-weight: 900;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.55), 0 0 25px rgba(255, 215, 0, 0.8);
      opacity: 0;
      pointer-events: none;
      transition: all 0.45s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      white-space: nowrap;
    }

    .celebration-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .celebration-toast .highlight {
      color: #ffeb3b;
      margin: 0 8px;
      text-decoration: underline;
      text-underline-offset: 6px;
    }

    /* 空資料提示 */
    .empty-state {
      margin: auto;
      text-align: center;
      color: #8e1111;
      font-size: 28px;
      font-weight: 900;
    }
  </style>
</head>
<body>
  <!-- 邀請卡背景 -->
  <div class="bg-layer"></div>
  <div class="bg-overlay"></div>

  <!-- 新捐款賀喜彈出橫幅 -->
  <div id="celebrationToast" class="celebration-toast"></div>

  <!-- 單頁大屏主框架 -->
  <div class="screen-wrapper">
    <!-- 頂部校徽與「捐 款 芳 名 錄」五圓金章 -->
    <header class="top-header">
      <div class="school-brand">
        <img src="太平國小_校徽.png" alt="太平國小校徽" class="school-emblem" />
        <div class="school-titles">
          <div class="school-name">新竹縣關西鎮太平國民小學</div>
          <div class="event-subtitle">72週年校慶「太平72 酷力全開」感恩芳名錄</div>
        </div>
      </div>

      <div class="honor-medallions" aria-label="捐款芳名錄">
        <div class="medallion">捐</div>
        <div class="medallion">款</div>
        <div class="medallion">芳</div>
        <div class="medallion">名</div>
        <div class="medallion">錄</div>
      </div>

      <div class="header-status">
        <div class="donor-counter">
          感恩芳名共 <strong id="totalCountEl">0</strong> 筆
        </div>
        <div class="sync-indicator">
          <span id="syncDot" class="sync-dot"></span>
          <span id="syncStatusText">每 5 秒即時更新中</span>
        </div>
      </div>
    </header>

    <!-- 中央紅榜展示板（所有芳名錄呈現在同一頁、自動最佳化最大字級） -->
    <main class="board-container" id="boardContainer">
      <div id="donationsGrid" class="donations-grid style-vertical-red"></div>
    </main>

    <!-- 底部預留給邀請卡「2026.11.21 太平72 酷力全開」紅布條 -->
    <div class="bottom-spacer"></div>
  </div>

  <!-- 右下角半透明快捷控制列（滑鼠移過去才會明顯顯示） -->
  <div class="floating-controls" id="floatingControls">
    <button class="ctrl-btn" id="btnToggleStyle" title="切換「傳統紅紙直書」或「現代橫式金卡」">
      📜 樣式：傳統紅條
    </button>
    <button class="ctrl-btn" id="btnToggleInk" title="切換紅條文字顏色（傳統墨黑字 / 喜慶金字）">
      🖋️ 字色：傳統墨黑
    </button>
    <button class="ctrl-btn" id="btnToggleLayout" title="切換保留底部邀請卡標語或全版最大化">
      🔍 版面：露出邀請卡底標
    </button>
    <button class="ctrl-btn" id="btnFontMinus" title="稍微調小字體">A-</button>
    <button class="ctrl-btn" id="btnFontPlus" title="稍微調大字體">A+</button>
    <button class="ctrl-btn" id="btnDemoCount" title="切換測試筆數（體驗 21筆 / 50筆 / 94筆 同頁自動縮放）">
      🧪 預覽筆數
    </button>
    <button class="ctrl-btn" id="btnSetGas" title="設定或檢視 Google GAS 雲端資料庫網址">
      ☁️ 雲端設定
    </button>
    <a href="admin.html" target="_blank" class="ctrl-btn" title="開啟電腦端後台輸入頁面">
      ⚙️ 後台輸入
    </a>
    <button class="ctrl-btn" id="btnFullscreen" title="切換全螢幕 (F11)">
      ⛶ 全螢幕
    </button>
  </div>

  <script src="shared.js"></script>
  <script>
    (function () {
      const gridEl = document.getElementById('donationsGrid');
      const boardEl = document.getElementById('boardContainer');
      const totalCountEl = document.getElementById('totalCountEl');
      const syncDot = document.getElementById('syncDot');
      const syncStatusText = document.getElementById('syncStatusText');
      const toastEl = document.getElementById('celebrationToast');

      // 顯示狀態設定
      let settings = getDisplaySettings();
      let inkMode = localStorage.getItem('tp72_ink_mode') || 'black'; // 'black' | 'gold'
      let currentItems = [];
      let knownIds = new Set();
      let isFirstLoad = true;
      let demoSliceMode = 0; // 0: 正常模式, 1: 21筆(照片), 2: 50筆, 3: 94筆(71週年全名單)
      let toastTimeout = null;

      /**
       * 智慧單頁排板演算法：
       * 根據目前螢幕寬高 (W, H) 與總筆數 (N)，找出能讓每張芳名錄面積最大、字體最清楚的 (欄數 cols × 列數 rows)
       * 確保「全部呈現在同一頁」且「每一格大小完全相同，長輩不會比較大小」
       */
      function computeOptimalGrid(count, containerW, containerH, cardStyle) {
        if (count <= 0) return { cols: 1, rows: 1, fontSize: 24 };

        let bestCols = 1;
        let bestRows = 1;
        let bestScore = -1;

        if (cardStyle === 'vertical-red') {
          // 傳統直書紅條：理想長寬比 (高/寬) 約在 2.0 ~ 3.8 之間
          // 例如照片中 21 筆分為 2 列 × 13 欄 (每條紅紙細長直立)
          const maxPossibleRows = Math.min(count, 6);
          for (let rows = 1; rows <= maxPossibleRows; rows++) {
            const cols = Math.ceil(count / rows);
            const gap = 6;
            const cellW = (containerW - gap * (cols - 1)) / cols;
            const cellH = (containerH - gap * (rows - 1)) / rows;
            if (cellW < 36 || cellH < 80) continue;

            const aspect = cellH / cellW; // 直條希望高大於寬
            // 計算此格可容納的最大字體大小（垂直雙欄：寬度需放 2 欄字，高度需放約 11~14 個字）
            const maxFontByW = (cellW - 10) / 2.25;
            const maxFontByH = (cellH - 36) / 11.5;
            let effectiveFont = Math.min(maxFontByW, maxFontByH);

            // 對過扁或過細長的比例給予輕微懲罰，選出最美觀且字最大的排法
            let aspectPenalty = 1.0;
            if (aspect < 1.35) aspectPenalty = 0.72;
            else if (aspect > 4.8) aspectPenalty = 0.82;

            // 盡量減少最後一列的空位浪費
            const fillRatio = count / (cols * rows);
            const score = effectiveFont * aspectPenalty * (0.85 + 0.15 * fillRatio);

            if (score > bestScore) {
              bestScore = score;
              bestCols = cols;
              bestRows = rows;
            }
          }

          const gap = count > 50 ? 4 : 6;
          const finalW = (containerW - gap * (bestCols - 1)) / bestCols;
          const finalH = (containerH - gap * (bestRows - 1)) / bestRows;
          const rawFont = Math.min((finalW - 8) / 2.15, (finalH - 32) / 10.5);
          const fontSize = Math.max(12, Math.min(38, rawFont * (settings.fontScaleAdjust || 1.0)));

          return { cols: bestCols, rows: bestRows, fontSize, gap };
        } else {
          // 現代橫式金框卡：理想寬高比 (寬/高) 約在 2.2 ~ 4.5 之間
          const maxPossibleCols = Math.min(count, 8);
          for (let cols = 1; cols <= maxPossibleCols; cols++) {
            const rows = Math.ceil(count / cols);
            const gap = 6;
            const cellW = (containerW - gap * (cols - 1)) / cols;
            const cellH = (containerH - gap * (rows - 1)) / rows;
            if (cellW < 110 || cellH < 34) continue;

            const maxFontByH = (cellH - 12) / 2.35;
            const maxFontByW = (cellW - 18) / 11.0;
            const effectiveFont = Math.min(maxFontByH, maxFontByW);
            const fillRatio = count / (cols * rows);
            const score = effectiveFont * (0.85 + 0.15 * fillRatio);

            if (score > bestScore) {
              bestScore = score;
              bestCols = cols;
              bestRows = rows;
            }
          }

          const gap = count > 50 ? 5 : 7;
          const finalW = (containerW - gap * (bestCols - 1)) / bestCols;
          const finalH = (containerH - gap * (bestRows - 1)) / bestRows;
          const rawFont = Math.min((finalH - 10) / 2.3, (finalW - 16) / 10.2);
          const fontSize = Math.max(13, Math.min(36, rawFont * (settings.fontScaleAdjust || 1.0)));

          return { cols: bestCols, rows: bestRows, fontSize, gap };
        }
      }

      /**
       * 針對個別字數特別長的單位（例如 18 個字元），自動微調該欄字距或字級，確保不截斷且卡片外框完全一樣大
       */
      function computeColumnFontStyle(text, baseFontSize, cellHeight, isVertical) {
        const len = Array.from(String(text || '')).length;
        if (!isVertical) {
          if (len > 14) {
            const scale = Math.max(0.68, 13.5 / len);
            return `font-size: ${(baseFontSize * scale).toFixed(1)}px;`;
          }
          return '';
        }
        // 直書時計算可用高度可容納幾個字
        const availableH = Math.max(60, cellHeight - baseFontSize * 2.1 - 14);
        const maxCharsNormal = Math.floor(availableH / (baseFontSize * 1.05));
        if (len > maxCharsNormal && len > 0) {
          const fittedSize = Math.max(10.5, (availableH / len) * 0.94);
          return `font-size: ${fittedSize.toFixed(1)}px; line-height: 1.0;`;
        }
        return '';
      }

      /**
       * 渲染整個芳名錄看板
       */
      function renderBoard(items, highlightIds = new Set()) {
        currentItems = items || [];
        totalCountEl.textContent = currentItems.length;

        // 套用版面設定
        document.body.classList.toggle('layout-full', settings.headerMode === 'full');
        updateControlButtonsText();

        if (currentItems.length === 0) {
          gridEl.style.gridTemplateColumns = '1fr';
          gridEl.style.gridTemplateRows = '1fr';
          gridEl.innerHTML = '<div class="empty-state">尚無捐款資料，請由後台輸入芳名錄</div>';
          return;
        }

        const rect = boardEl.getBoundingClientRect();
        const availW = Math.max(300, rect.width - 16);
        const availH = Math.max(200, rect.height - 16);

        const cardStyle = settings.cardStyle || 'vertical-red';
        const { cols, rows, fontSize, gap } = computeOptimalGrid(currentItems.length, availW, availH, cardStyle);
        const cellH = (availH - gap * (rows - 1)) / rows;

        gridEl.className = `donations-grid style-${cardStyle}`;
        gridEl.style.gap = `${gap}px`;
        gridEl.style.gridTemplateColumns = `repeat(${cols}, minmax(0, 1fr))`;
        gridEl.style.gridTemplateRows = `repeat(${rows}, minmax(0, 1fr))`;
        document.documentElement.style.setProperty('--card-font-size', `${fontSize.toFixed(1)}px`);

        const displayList = settings.sortOrder === 'input-desc'
          ? [...currentItems].reverse()
          : [...currentItems];

        const htmlParts = displayList.map((item) => {
          const donor = escapeHtml(item.donor || '');
          const gift = escapeHtml(item.displayContent || formatDonationDisplay(item.rawContent, item.type));
          const isNew = highlightIds.has(String(item.id));
          const newClass = isNew ? 'newly-added' : '';
          const inkClass = inkMode === 'gold' ? 'gold-ink' : '';

          if (cardStyle === 'vertical-red') {
            const donorStyle = computeColumnFontStyle(item.donor, fontSize, cellH, true);
            const giftStyle = computeColumnFontStyle(item.displayContent || item.rawContent, fontSize, cellH, true);
            return `
              <div class="donor-card vertical-red ${inkClass} ${newClass}" data-id="${escapeHtml(item.id)}">
                <div class="strip-top-labels">
                  <div class="label-col"><span>捐</span><span>贈</span></div>
                  <div class="label-col"><span>感</span><span>謝</span></div>
                </div>
                <div class="strip-body">
                  <div class="vertical-col gift-col" style="${giftStyle}">${gift}</div>
                  <div class="vertical-col donor-col" style="${donorStyle}">${donor}</div>
                </div>
              </div>
            `;
          } else {
            const donorStyle = computeColumnFontStyle(item.donor, fontSize, cellH, false);
            return `
              <div class="donor-card horizontal-card ${newClass}" data-id="${escapeHtml(item.id)}">
                <div class="h-top-row">
                  <span class="h-donor-name" style="${donorStyle}">${donor}</span>
                  <span class="h-thanks-tag">感謝捐贈</span>
                </div>
                <div class="h-gift-row">${gift}</div>
              </div>
            `;
          }
        });

        gridEl.innerHTML = htmlParts.join('');
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      /**
       * 顯示新捐款賀喜彈窗
       */
      function showCelebrationToast(newItems) {
        if (!newItems || newItems.length === 0) return;
        const latest = newItems[newItems.length - 1];
        const giftText = latest.displayContent || formatDonationDisplay(latest.rawContent, latest.type);
        toastEl.innerHTML = `🎉 誠摯感謝 <span class="highlight">${escapeHtml(latest.donor)}</span> 慷慨捐贈 <span class="highlight">${escapeHtml(giftText)}</span>！`;
        toastEl.classList.add('show');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toastEl.classList.remove('show');
        }, 6500);
      }

      /**
       * 比對新舊資料並觸發無閃爍更新
       */
      function applyIncomingData(items, sourceLabel) {
        const incomingIds = new Set(items.map(i => String(i.id)));
        const newHighlightIds = new Set();
        const newlyAddedItems = [];

        if (!isFirstLoad) {
          for (const item of items) {
            const sid = String(item.id);
            if (!knownIds.has(sid)) {
              newHighlightIds.add(sid);
              newlyAddedItems.push(item);
            }
          }
        }

        // 檢查資料內容是否有變動，若無變動且非強制重繪則不重建 DOM（完全不閃爍）
        const prevSignature = JSON.stringify(currentItems);
        const nextSignature = JSON.stringify(items);

        knownIds = incomingIds;
        isFirstLoad = false;

        if (prevSignature !== nextSignature || newHighlightIds.size > 0) {
          renderBoard(items, newHighlightIds);
          if (newlyAddedItems.length > 0) {
            showCelebrationToast(newlyAddedItems);
          }
        }

        const nowTime = new Date().toLocaleTimeString('zh-TW', { hour12: false });
        syncStatusText.textContent = `${sourceLabel} (${nowTime})`;
      }

      /**
       * 每 5 秒從 GAS 或本機抓取最新資料
       */
      async function fetchLatestDonations() {
        // 若處於預覽測試筆數模式，不覆蓋畫面
        if (demoSliceMode > 0) return;

        const gasUrl = getGasUrl();
        if (!gasUrl) {
          syncDot.className = 'sync-dot';
          const localItems = getLocalDonations();
          applyIncomingData(localItems, '本機即時同步中・每5秒更新');
          return;
        }

        try {
          syncDot.className = 'sync-dot syncing';
          const sep = gasUrl.includes('?') ? '&' : '?';
          const res = await fetch(`${gasUrl}${sep}action=list&_t=${Date.now()}`, {
            method: 'GET',
            cache: 'no-store'
          });
          const data = await res.json();
          if (data && data.status === 'ok' && Array.isArray(data.items)) {
            syncDot.className = 'sync-dot';
            saveLocalDonations(data.items);
            applyIncomingData(data.items, '雲端即時連線・每5秒更新');
          } else {
            throw new Error(data.message || 'GAS 回傳格式異常');
          }
        } catch (err) {
          syncDot.className = 'sync-dot offline';
          const fallbackItems = getLocalDonations();
          applyIncomingData(fallbackItems, '離線備援顯示中');
        }
      }

      /**
       * 更新右下角控制按鈕文字
       */
      function updateControlButtonsText() {
        document.getElementById('btnToggleStyle').textContent =
          settings.cardStyle === 'vertical-red' ? '📜 樣式：傳統紅條' : '🪪 樣式：喜慶橫卡';
        document.getElementById('btnToggleInk').textContent =
          inkMode === 'gold' ? '🖋️ 字色：喜慶金字' : '🖋️ 字色：傳統墨黑';
        document.getElementById('btnToggleLayout').textContent =
          settings.headerMode === 'full' ? '🔍 版面：全螢幕最大化' : '🔍 版面：露出邀請卡底標';
      }

      // 綁定控制列按鈕事件
      document.getElementById('btnToggleStyle').addEventListener('click', () => {
        const nextStyle = settings.cardStyle === 'vertical-red' ? 'horizontal-card' : 'vertical-red';
        settings = saveDisplaySettings({ cardStyle: nextStyle });
        renderBoard(currentItems);
      });

      document.getElementById('btnToggleInk').addEventListener('click', () => {
        inkMode = inkMode === 'black' ? 'gold' : 'black';
        localStorage.setItem('tp72_ink_mode', inkMode);
        renderBoard(currentItems);
      });

      document.getElementById('btnToggleLayout').addEventListener('click', () => {
        const nextLayout = settings.headerMode === 'full' ? 'compact' : 'full';
        settings = saveDisplaySettings({ headerMode: nextLayout });
        setTimeout(() => renderBoard(currentItems), 50);
      });

      document.getElementById('btnFontMinus').addEventListener('click', () => {
        const nextScale = Math.max(0.75, (settings.fontScaleAdjust || 1.0) - 0.06);
        settings = saveDisplaySettings({ fontScaleAdjust: Number(nextScale.toFixed(2)) });
        renderBoard(currentItems);
      });

      document.getElementById('btnFontPlus').addEventListener('click', () => {
        const nextScale = Math.min(1.4, (settings.fontScaleAdjust || 1.0) + 0.06);
        settings = saveDisplaySettings({ fontScaleAdjust: Number(nextScale.toFixed(2)) });
        renderBoard(currentItems);
      });

      document.getElementById('btnDemoCount').addEventListener('click', (e) => {
        demoSliceMode = (demoSliceMode + 1) % 4;
        if (demoSliceMode === 0) {
          e.target.textContent = '🧪 預覽筆數';
          e.target.classList.remove('active');
          isFirstLoad = true;
          fetchLatestDonations();
        } else if (demoSliceMode === 1) {
          e.target.textContent = '🧪 預覽：21筆 (照片紅榜)';
          e.target.classList.add('active');
          renderBoard(DEMO_71_DONATIONS.slice(0, 21));
          syncStatusText.textContent = '預覽模式：21筆';
        } else if (demoSliceMode === 2) {
          e.target.textContent = '🧪 預覽：50筆 (中型版面)';
          e.target.classList.add('active');
          renderBoard(DEMO_71_DONATIONS.slice(0, 50));
          syncStatusText.textContent = '預覽模式：50筆';
        } else if (demoSliceMode === 3) {
          e.target.textContent = '🧪 預覽：94筆 (71週年全數同頁)';
          e.target.classList.add('active');
          renderBoard(DEMO_71_DONATIONS);
          syncStatusText.textContent = '預覽模式：94筆同頁';
        }
      });

      document.getElementById('btnSetGas').addEventListener('click', () => {
        const current = getGasUrl();
        const input = prompt('請貼上您的 Google Apps Script (GAS) 網頁應用程式網址（結尾為 /exec）：', current);
        if (input !== null) {
          setGasUrl(input.trim());
          isFirstLoad = true;
          fetchLatestDonations();
        }
      });

      document.getElementById('btnFullscreen').addEventListener('click', () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      });

      // 視窗大小改變時立即重新計算最佳網格與字級
      window.addEventListener('resize', () => {
        renderBoard(currentItems);
      });

      // 監聽來自後台 (admin.html) 的跨分頁即時廣播（0秒延遲反應）
      if (tp72Channel) {
        tp72Channel.onmessage = (event) => {
          const msg = event.data;
          if (!msg) return;
          if (msg.type === 'donations_updated' && demoSliceMode === 0) {
            applyIncomingData(msg.payload, '後台即時推播');
          } else if (msg.type === 'settings_updated') {
            settings = getDisplaySettings();
            renderBoard(currentItems);
          } else if (msg.type === 'gas_url_updated') {
            fetchLatestDonations();
          }
        };
      }

      window.addEventListener('storage', (e) => {
        if (e.key === TP72_STORAGE_KEYS.LOCAL_ITEMS && demoSliceMode === 0) {
          applyIncomingData(getLocalDonations(), '後台即時同步');
        } else if (e.key === TP72_STORAGE_KEYS.SETTINGS) {
          settings = getDisplaySettings();
          renderBoard(currentItems);
        }
      });

      // 初次載入與啟動每 5 秒定時更新
      fetchLatestDonations();
      setInterval(fetchLatestDonations, 5000);
    })();
  </script>
</body>
